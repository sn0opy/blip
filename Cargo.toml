[package]
name = "blip"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
description = "blip (Batch Lightframe Inspection & Preview): fast, minimal FITS / XISF image blinker for astrophotography"
authors = ["Sascha Ohms"]
license = "MIT"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
eframe = { version = "0.36.2", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "accesskit",
    "persistence",
] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
lz4 = "1.28.1"
quick-xml = "0.42.0"
rayon = "1.12.0"
rfd = "0.17.2"
zstd = { version = "0.14.2", default-features = false }

# With eframe's default features off, Linux needs its windowing backends enabled explicitly.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "wayland",
    "x11",
] }

# Finder hands documents over through the app delegate (src/macos.rs). Same versions winit uses.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSNotification",
    "NSOperation",
    "NSString",
    "NSURL",
] }

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[build-dependencies]
winresource = "0.1.31"

[package.metadata.packager]
product-name = "blip"
identifier = "sh.sascha.blip"
category = "Photography"
out-dir = "dist"
icons = ["assets/icons/icon-*.png", "assets/icons/icon.ico"]
binaries = [{ path = "blip", main = true }]
# THIRD_PARTY_LICENSES.txt is generated by the scripts with cargo-about (about.toml).
resources = ["LICENSE", "target/THIRD_PARTY_LICENSES.txt"]

# Lets the OS open FITS and XISF files with blip (Finder document types, Windows "Open with").
[[package.metadata.packager.file-associations]]
extensions = ["fit", "fits", "fts"]
mime-type = "image/fits"
name = "FITS image"
description = "FITS image"
role = "viewer"

[[package.metadata.packager.file-associations]]
extensions = ["xisf"]
mime-type = "image/x-xisf"
name = "XISF image"
description = "XISF image"
role = "viewer"

[package.metadata.packager.nsis]
installer-icon = "assets/icons/icon.ico"
compression = "lzma"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
