[package]
name = "blip-core"
description = "Image decoding, stretching, star detection and export shared by blip's desktop app and web build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
bytemuck.workspace = true
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
lz4_flex = "0.14.0"
quick-xml = "0.42.0"
rayon.workspace = true
zrip = { version = "0.8.11", default-features = false, features = ["alloc", "simd"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
